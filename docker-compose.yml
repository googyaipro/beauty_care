version: '3.8'

services:
  registry_server:
    build: .
    container_name: beauty_registry_server
    command: python3 registry_server/server.py
    ports:
      - "8000:8000"
    environment:
      - PRODUCTION_DOMAIN=beauty-registry.oxyjet.win
    restart: always

  google_calendar_crm_mcp:
    build: .
    container_name: beauty_google_calendar_crm_mcp
    command: python3 mcp_servers/google_calendar_crm_mcp/server.py
    ports:
      - "8015:8015"
    restart: always

  payment_mcp:
    build: .
    container_name: beauty_payment_mcp
    command: python3 mcp_servers/payment_mcp/server.py
    ports:
      - "8016:8016"
    restart: always

  maps_mcp:
    build: .
    container_name: beauty_maps_mcp
    command: python3 mcp_servers/maps_mcp/server.py
    ports:
      - "8014:8014"
    restart: always

  admin_cms:
    build: .
    container_name: beauty_admin_cms
    command: python3 admin_cms/app.py
    ports:
      - "8019:8019"
    environment:
      - PRODUCTION_DOMAIN=beauty-admin.oxyjet.win
    restart: always

  telegram_gateway:
    build: .
    container_name: beauty_telegram_gateway
    command: python3 gateways/telegram_gateway.py
    ports:
      - "8021:8021"
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
    restart: always

  whatsapp_gateway:
    build: .
    container_name: beauty_whatsapp_gateway
    command: python3 gateways/whatsapp_gateway.py
    ports:
      - "8022:8022"
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
    restart: always
