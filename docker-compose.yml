version: '3.8'

services:
  registry_server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PRODUCTION_DOMAIN=beauty-registry.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry_server.rule=Host(`beauty-registry.oxyjet.win`)"
      - "traefik.http.routers.registry_server.entrypoints=web,websecure"
      - "traefik.http.services.registry_server.loadbalancer.server.port=8000"
    restart: always

  google_calendar_crm_mcp:
    build: .
    ports:
      - "8015:8015"
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  payment_mcp:
    build: .
    ports:
      - "8016:8016"
    volumes:
      - ./data:/app/data
    restart: always

  maps_mcp:
    build: .
    ports:
      - "8014:8014"
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  admin_cms:
    build: .
    ports:
      - "8001:8001"
    environment:
      - PRODUCTION_DOMAIN=beauty-admin.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin_cms.rule=Host(`beauty.oxyjet.win`) || Host(`beauty-admin.oxyjet.win`) || Host(`beauty-api.oxyjet.win`)"
      - "traefik.http.routers.admin_cms.entrypoints=web,websecure"
      - "traefik.http.services.admin_cms.loadbalancer.server.port=8001"
    restart: always

  telegram_gateway:
    build: .
    ports:
      - "8021:8021"
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  whatsapp_gateway:
    build: .
    ports:
      - "8022:8022"
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always
