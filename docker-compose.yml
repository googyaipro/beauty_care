version: '3.8'

services:
  registry_server:
    build: .
    ports:
      - "8000:8000"
    command: ["python3", "registry_server/server.py"]
    environment:
      - PRODUCTION_DOMAIN=beauty-registry.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  google_calendar_crm_mcp:
    build: .
    ports:
      - "8015:8015"
    command: ["python3", "mcp_servers/google_calendar_crm_mcp/server.py"]
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  payment_mcp:
    build: .
    ports:
      - "8016:8016"
    command: ["python3", "mcp_servers/payment_mcp/server.py"]
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  maps_mcp:
    build: .
    ports:
      - "8014:8014"
    command: ["python3", "mcp_servers/maps_mcp/server.py"]
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  admin_cms:
    build: .
    ports:
      - "8001:8001"
    command: ["python3", "admin_cms/app.py"]
    environment:
      - PRODUCTION_DOMAIN=beauty-admin.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  telegram_gateway:
    build: .
    ports:
      - "8021:8021"
    command: ["python3", "gateways/telegram_gateway.py"]
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

  whatsapp_gateway:
    build: .
    ports:
      - "8022:8022"
    command: ["python3", "gateways/whatsapp_gateway.py"]
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    networks:
      - default
    restart: always

