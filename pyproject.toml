[project]
name = "beauty_care"
version = "0.1.0"
description = "Multilingual Multi-Agent Ecosystem for Beauty Salons & Spas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.0",
    "fastapi>=0.115.0",
    "google-adk>=0.1.0",
    "google-auth>=2.30.0",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.10.0",
    "pytest>=8.0.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "registry_server", "mcp_servers", "agents", "gateways", "admin_cms"]
