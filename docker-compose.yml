version: '3.8'

services:
  registry_server:
    build: .
    network_mode: host
    environment:
      - PRODUCTION_DOMAIN=beauty-registry.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  google_calendar_crm_mcp:
    build: .
    network_mode: host
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  payment_mcp:
    build: .
    network_mode: host
    volumes:
      - ./data:/app/data
    restart: always

  maps_mcp:
    build: .
    network_mode: host
    environment:
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  admin_cms:
    build: .
    network_mode: host
    environment:
      - PRODUCTION_DOMAIN=beauty-admin.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  telegram_gateway:
    build: .
    network_mode: host
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always

  whatsapp_gateway:
    build: .
    network_mode: host
    environment:
      - BASE_API_URL=https://beauty-api.oxyjet.win
      - GOOGLE_CLOUD_PROJECT=beauty-care-platform
    volumes:
      - ./data:/app/data
    restart: always
